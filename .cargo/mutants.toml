# Scopes cargo-mutants to modules a test can actually reach; see `just mutants`. Excluded on
# purpose: claim.rs (its one live branch needs two kernels in one process), raw.rs (thin unsafe
# forwarders, no errors built), error.rs (derived enum), lib.rs's open/close paths (unreachable
# without `faults`). Each would only ever report MISSED, indistinguishable from a real gap.
examine_globs = [
    "crates/idakit/src/types/diff/**/*.rs",
    "crates/idakit/src/types/expr.rs",
    "crates/idakit/src/types/tinfo.rs",
    "crates/idakit/src/arena.rs",
    "crates/idakit/src/address.rs",
    "crates/idakit/src/ffi.rs",
    "crates/idakit/src/search.rs",
    "crates/idakit/src/strings.rs",
    "crates/idakit/src/bitness.rs",
    "crates/idakit/src/meta.rs",
    "crates/idakit/src/name.rs",
    "crates/idakit/src/stack.rs",
    "crates/idakit/src/xref.rs",
    "crates/idakit/src/bytes.rs",
    "crates/idakit/src/flowchart.rs",
    "crates/idakit/src/instruction/**/*.rs",
    "crates/idakit/src/netnode/**/*.rs",
    "crates/idakit/src/function/signature.rs",
    "crates/idakit/src/types/builder.rs",
    "crates/idakit/src/types/edit.rs",
    "crates/idakit/src/types/mod.rs",
    "crates/idakit/src/types/named.rs",
    "crates/idakit/src/types/repr.rs",
    "crates/idakit/src/types/resolved.rs",
    "crates/idakit/src/types/sink.rs",
    "crates/idakit/src/decompiler/**/*.rs",
]

# Mutants no test can kill: equivalent-by-construction, or a real infinite loop that only times
# out. One line each says why.
exclude_re = [
    # defensive counter that never runs
    "replace \\+= with .* in Database::type_catalog_with",
    # disjoint-bit OR/XOR swap; the real GN_VISIBLE-dropping sibling is caught by a substitution test
    "replace \\| with \\^ in parse_hex_token",
    # disjoint-bit OR/XOR swap over demangle flags, no observable change
    "replace \\| with \\^ in Database::(short|long)_name",
    # get_item_end never echoes its input (BADADDR-only per bytes.hpp), so > and >= agree
    "replace > with >= in <impl Iterator for Instructions(In)?<'_>>::next",
    # external blocks never gain succ edges, so cfg_preds never yields nproper; < and <= agree
    "replace < with <= in predecessors",
    # ordinals run 1..limit and empty-named slots are skipped, so < and <= yield the same sequence
    "replace < with <= in <impl Iterator for NamedTypes<'db>>::next",
    # next sticks at 1: a real infinite loop, only ever times out
    "replace \\+= with \\*= in <impl Iterator for NamedTypes<'db>>::next",
    # constant handle builds a cyclic table that hangs the walk; the -> 0 sibling is caught
    "replace raw -> u32 with 1",
    # POSTFIX vs PRIMARY is unobservable: the max requested min_prec is 15, so neither parenthesizes
    "delete match arm ExpressionKind::Call\\{\\.\\.\\}.* in Printer<'_>::prec",
]

# Matches what `just test` builds; a feature-gated function excluded here would get mutants no
# compiled test could ever kill.
all_features = true

# `cargo`, not `nextest`, and that is forced rather than preferred: the `kernel` binary is
# `test = false`, and nextest lists nothing for it even when named with `--test kernel`, so under
# nextest every kernel-bound mutant would report MISSED against a run that never executed a kernel
# test. Plain `cargo test` selects the target by name. The usual hazard of `cargo test` (one process
# per binary, colliding on the `init_library` singleton) does not apply to the binaries named below:
# `kernel` brings the kernel up once per worker and serves many cases in it by design, and `ctor`
# and `ctree_nodes` hold one test each.
test_tool = "cargo"

# Unit tests plus the kernel binaries covering the globs above; pure vs. kernel-bound is a
# property of functions, not files, so both halves are needed. Add a binary here when adding its
# glob, or its mutants go unchecked. The corpus fan-out is deliberately excluded, through
# IDAKIT_TEST_SCOPE in `just mutants`: it dominates wall time by running every check against every
# fixture, which says nothing about the code under test.
additional_cargo_test_args = [
    "--lib",
    "--test",
    "kernel",
    "--test",
    "ctor",
    "--test",
    "ctree_nodes",
]

# Each job builds in its own scratch copy of the tree; gitignore-filtering it keeps that copy to
# ~5 MiB instead of ~2 GiB (local databases, a vendored SDK checkout). copy_target can't override
# this, since the filter runs during the walk before target/ would be handed over.
gitignore = true
copy_target = false

# Mutants only need pass/fail, never a symbolized backtrace; full debuginfo on hundreds of
# per-mutant binaries is pure write traffic.
profile = "mutants"
