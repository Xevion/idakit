# Publishes one release unit to crates.io when its tag is pushed, then cuts its GitHub Releases.
# `idakit-sys-vX.Y.Z` publishes idakit-sys-codegen and idakit-sys, which share a pinned cxx
# generation and always release together; `idakit-vX.Y.Z` publishes idakit. The codegen crate's
# own tag (`idakit-sys-codegen-v`) matches neither pattern, so it only labels the release.
# Fetches the IDA runtime (as CI does) so `cargo publish`'s verification build links libida.

name: release

on:
  push:
    tags: ["idakit-sys-v*", "idakit-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish again (idakit-sys-vX.Y.Z or idakit-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    # secrets can't gate a job-level `if`; the runtime var lets forks without it skip cleanly.
    if: ${{ vars.S3_RUNTIME_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Releases.
      id-token: write # Mint the OIDC token trusted publishing exchanges for a registry token.
    env:
      RUST_BACKTRACE: "1"
      TAG: ${{ inputs.tag || github.ref_name }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # Uncached: this build gets published, and any PR can write the cache it would restore.
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      - name: Resolve the release unit from the tag
        id: unit
        run: |
          case "$TAG" in
            idakit-sys-v*) crates="idakit-sys-codegen idakit-sys"; version="${TAG#idakit-sys-v}" ;;
            idakit-v*) crates="idakit"; version="${TAG#idakit-v}" ;;
            *) echo "::error::$TAG is not a release tag"; exit 1 ;;
          esac
          for crate in $crates; do
            actual=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [ "$actual" != "$version" ]; then
              echo "::error::$crate is $actual in the manifest but the tag says $version"
              exit 1
            fi
          done
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Fetch IDA runtime
        uses: $/.github/actions/fetch-runtime
        with:
          version: 9.3.260421sp2
          platform: linux-x64
          sdk-tag: v9.3.1-release
      # Trusted publishing: crates.io trades this job's OIDC identity for a token scoped to these
      # crates, revoked when the job ends. One auth step covers the whole publish.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # One invocation per unit: cargo verifies each crate against a temporary registry holding the
      # others, so idakit-sys never waits for idakit-sys-codegen's index entry to appear.
      - name: Publish to crates.io
        env:
          CRATES: ${{ steps.unit.outputs.crates }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo publish --locked "${args[@]}"
      # Each crate's Release takes its notes from that version's CHANGELOG.md section.
      - name: Create GitHub Releases
        env:
          CRATES: ${{ steps.unit.outputs.crates }}
          VERSION: ${{ steps.unit.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for crate in $CRATES; do
            notes=$(awk -v v="$VERSION" '/^## /{ if (found) exit; found = index($0, "[" v "]") || index($0, "## " v " "); next } found' "crates/$crate/CHANGELOG.md")
            gh release create "$crate-v$VERSION" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "$crate: v$VERSION" --notes "$notes"
          done
