# Line coverage over the workspace against a real IDA runtime, uploaded to Codecov. Gated on the
# S3_* secrets like `check` is: almost every interesting line needs a live kernel, so a
# runtime-less run would report a coverage collapse rather than no coverage. Linux-x64 only, since
# the answer varies by host only on `#[cfg]`-split code. Reports, never gates.

name: coverage

on:
  push:
    branches: [master] # PR branches run via pull_request; avoids the double run
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency:` group on purpose: even with cancel-in-progress off, a group holds one pending
# run per ref and cancels the rest, so a pushed stack loses every commit's verdict but the last.

jobs:
  coverage:
    name: coverage
    # secrets can't gate a job-level `if`; use a var instead (forks without it skip).
    if: ${{ vars.S3_RUNTIME_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTFLAGS: --cfg coverage_nightly
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      # `coverage(off)` is unstable, so the exceptions need nightly; the override displaces
      # rust-toolchain.toml's pinned stable for this job only. Via rustup, not a pinned action: the
      # upstream `nightly` branch is force-pushed, so a SHA pinned to it goes unreachable.
      - name: Install nightly
        run: rustup toolchain install nightly --component llvm-tools-preview --profile minimal
      - name: Override toolchain to nightly
        run: rustup override set nightly
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Fetch IDA runtime
        uses: ./.github/actions/fetch-runtime
        with:
          version: 9.3.260421sp2
          platform: linux-x64
          sdk-tag: v9.3.1-release
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Accept IDA EULA
        run: cargo run -q -p idakit --example accept_eula
      - name: Fetch test corpus
        uses: ./.github/actions/fetch-corpus
      # Doctests are left out (`--doctests` is still incomplete); they run under `just test`.
      #
      # `llvm-cov nextest` alone would miss the `kernel` binary, which nextest never lists because
      # it is `test = false` and drives its own warm workers. Exporting the instrumentation with
      # `show-env` lets both runners write into one profile set, so its ~900 cases count. The junit
      # report below still comes from the nextest half.
      - name: Run tests with coverage and generate reports
        run: |
          # shellcheck disable=SC1090  # the env is generated, so there is no file to follow
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo nextest run --workspace --all-features --profile ci --no-fail-fast --hide-progress-bar --failure-output final
          cargo test -p idakit --all-features --test kernel
          mkdir -p coverage
          cargo llvm-cov report --html --output-dir coverage/html
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 7
      - name: Upload LCOV report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
