name: fetch-corpus
description: Fetch the platform-independent CI-tier corpus fixtures from S3 (content-addressed blobs + a filtered manifest) and export IDAKIT_CORPUS_MANIFEST.

runs:
  using: composite
  steps:
    # Credentials arrive as job-level env (AWS_*, S3_ENDPOINT, S3_BUCKET), same as
    # fetch-runtime. Fixtures are host-independent (an analyzed .i64 opens the same on every
    # OS), so every platform fetches the identical tier; IDAKIT_CORPUS_MANIFEST feeds the
    # corpus test matrix and the dedicated tests' canonical database.
    - name: Fetch corpus
      shell: bash
      env:
        AWS_RETRY_MODE: standard
        AWS_MAX_ATTEMPTS: "10"
      # The exported GITHUB_ENV path is built from RUNNER_TEMP, never from an input.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        tmp="$RUNNER_TEMP"
        [ "${RUNNER_OS:-}" = Windows ] && tmp="$(cygpath -u "$RUNNER_TEMP")"
        dest="$tmp/corpus"
        mkdir -p "$dest"
        export dest

        # A response body that dies mid-stream (IncompleteRead) exhausts the CLI's own per-part
        # retries and surfaces as a failed copy, so restart the whole transfer with a backoff.
        s3_get() {
          local attempt=1
          until aws s3 cp "$1" "$2" --endpoint-url "$S3_ENDPOINT" --only-show-errors; do
            [ "$attempt" -lt 4 ] || { echo "giving up on $1 after $attempt attempts" >&2; return 1; }
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
            echo "retrying $1 (attempt $attempt)" >&2
          done
        }
        export -f s3_get

        s3_get "s3://$S3_BUCKET/corpus/manifest.toml" "$dest/manifest.toml"

        # macOS ships `shasum`, not coreutils `sha256sum`; pick whichever exists.
        sha_of() {
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1
          else shasum -a 256 "$1" | cut -d' ' -f1; fi
        }
        export -f sha_of

        # The published manifest is machine-generated with a fixed shape (path then sha256 per
        # fixture), so a two-line awk extracts the pairs without a TOML parser.
        awk -F' = ' '
          /^path = /   { p=$2; gsub(/"/,"",p) }
          /^sha256 = / { s=$2; gsub(/"/,"",s); print p"\t"s }
        ' "$dest/manifest.toml" > "$dest/index.tsv"

        fetch_one() {
          local rel="$1" sha="$2" out got
          out="$dest/$rel"
          mkdir -p "$(dirname "$out")"
          # No `set -e` in this xargs subshell, so a dead download would otherwise reach the
          # digest check and be reported as a mismatch instead of a fetch failure.
          s3_get "s3://$S3_BUCKET/corpus/blobs/$sha" "$out" || exit 1
          got="$(sha_of "$out")"
          [ "$got" = "$sha" ] || { echo "sha256 mismatch for $rel: $got != $sha" >&2; exit 1; }
        }
        export -f fetch_one

        # Fixtures are independent, so fan the downloads out instead of fetching them serially.
        # index.tsv has no embedded whitespace, so plain word-splitting into (rel, sha) pairs is safe.
        xargs -P4 -n2 bash -c 'fetch_one "$0" "$1"' < "$dest/index.tsv"

        manifest="$dest/manifest.toml"
        [ "${RUNNER_OS:-}" = Windows ] && manifest="$(cygpath -w "$manifest")"
        echo "IDAKIT_CORPUS_MANIFEST=$manifest" >> "$GITHUB_ENV"
        echo "fetched $(wc -l < "$dest/index.tsv") corpus fixtures into $dest"
