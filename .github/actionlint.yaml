# actionlint 1.7.12 predates GitHub's `$/` self-repository `uses:` form and rejects it as a
# missing ref (rhysd/actionlint#711). The pattern matches only that spelling, so a genuinely
# malformed `uses:` still fails.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'specifying action "\$/.+" in invalid format because ref is missing'
