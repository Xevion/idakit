# Caps what nextest still runs: the test binaries that bring a kernel up themselves. Each opens a
# private DB copy, so RAM is the only limit (~0.85 GiB/slot); lower on a RAM-tight runner.
# slow-timeout kills a wedged test. `corpus_matrix` and `kernel` are not listed here because nextest
# never sees them: they are their own runners and schedule their own workers.

[profile.default]
fail-fast = false

[test-groups]
kernel = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'kind(test)'
test-group = 'kernel'
slow-timeout = { period = "60s", terminate-after = 3 }

# For the coverage workflow, which uploads this junit report to Codecov beside the lcov one.
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true
store-success-output = false

# For `just mutants`, which asks a different question than `just test` does. A run there wants to
# know only whether *some* test rejects the mutant, and roughly three quarters of them do, so
# finishing the suite past the first failure buys nothing and costs a kernel per remaining test.
# The default stays false, because a developer reading a real failure wants every failure at once.
# Inherits the default profile, so the caps and timeouts above still apply.
[profile.mutants]
fail-fast = true
