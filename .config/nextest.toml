# Caps what nextest still runs: the test binaries that bring a kernel up themselves. Each opens a
# private DB copy, so RAM is the only limit (~0.85 GiB/slot); lower on a RAM-tight runner.
# slow-timeout kills a wedged test. `kernel` is not listed here because nextest never sees it: it is
# its own runner and schedules its own workers.

[profile.default]
fail-fast = false

[test-groups]
kernel = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'kind(test)'
test-group = 'kernel'
slow-timeout = { period = "60s", terminate-after = 3 }

# For the coverage workflow, which uploads this junit report to Codecov beside the lcov one.
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true
store-success-output = false
