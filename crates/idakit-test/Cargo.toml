[package]
name = "idakit-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# harness = false: the smoke binary is its own runner (daemon / list / proxy), speaking nextest's
# list+exact protocol. Its cases come from the `inventory` registry at runtime, not from libtest.
[[test]]
name = "smoke"
path = "tests/smoke.rs"
harness = false

[dependencies]
idakit = { path = "../idakit" }
# Direct dep only so build.rs receives DEP_IDA_LIB_DIR (published to direct dependents of the
# `links = "ida"` crate) for the runtime rpath; the real linkage comes through idakit.
idakit-sys = { path = "../idakit-sys" }
idakit-test-macros = { path = "../idakit-test-macros" }
inventory = "0.3.24"
libc = "0.2.186"

[dev-dependencies]
rstest = "0.26.1"
