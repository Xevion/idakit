[package]
name = "idakit-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]

[lints]
workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
# Win32_Security is load-bearing: windows-sys emits `CreateJobObjectW` only once the
# SECURITY_ATTRIBUTES in its signature is available.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
assert2 = "0.4.0"
